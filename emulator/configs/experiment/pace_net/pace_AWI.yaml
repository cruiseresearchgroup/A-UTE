# @package _global_
# to execute this experiment run:
# python run.py experiment=example

defaults:
  - override /mode: exp.yaml
  - override /trainer: default.yaml
  - override /model: pace_net.yaml # put the desired model name here
  - override /callbacks: default.yaml
  - override /logger: wandb.yaml
  - override /datamodule: climate.yaml # standard datamodule configurations
  - override /optimizer@model.optimizer: adam.yaml

name: "AWI"

seed: 2000

ckpt_path: ${model.pretrained_ckpt_dir}

trainer:
  min_epochs: 1
  max_epochs: 30

model:
  loss_function: "nll"
  monitor: "val/llrmse_climax"
  finetune: False
  pretrained_run_id: null
  pretrained_ckpt_dir: null

datamodule:
  in_var_ids: ['BC_sum', 'CO2_sum', 'SO2_sum', 'CH4_sum', 'tas', 'pr']
  out_var_ids: ['tas','pr']
  train_scenarios: ["ssp126"]
  test_scenarios: ["ssp245"]
  val_scenarios: ["ssp370"]
  train_historical_years: "1850-2010"
  test_years: "2015-2100"
  train_years: "2015-2100"
  val_split: 0.1
  train_models:  ["AWI-CM-1-1-MR"]
  test_models: ["AWI-CM-1-1-MR"]
  seq_len: 12
  val_seq_len: 120
  lon: 144
  lat: 96
  batch_size: 4
  eval_batch_size: 4

logger:
  wandb:
      _target_: pytorch_lightning.loggers.WandbLogger
      tags: ["single_emulator", "pacer", "AWI", "tas+pr"] 
      project: emulator
      id: pace_AWI_ssp
      resume: allow
      save_dir: 
      log_model: true